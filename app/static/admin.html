<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实验管理台 · 三角嗅辨盲评</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e3e6eb;
          --brand:#2f6fed; --brand-d:#1f56c4; --ok:#047857; --ok-bg:#d1fae5;
          --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(135deg,#1e3a8a,#2f6fed); color:#fff; padding:24px 20px; }
  header h1 { margin:0 0 4px; font-size:20px; }
  header p { margin:0; opacity:.85; font-size:13px; }
  main { max-width:960px; margin:24px auto 60px; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:20px 24px; margin-bottom:18px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  h2 { margin:0 0 12px; font-size:17px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .stat .k { font-size:12px; color:var(--muted); }
  .stat .v { font-size:18px; font-weight:700; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge.open { background:var(--ok-bg); color:var(--ok); }
  .badge.closed { background:var(--warn-bg); color:var(--warn); }
  .badge.settled { background:#e0e7ff; color:#3730a3; }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:12px; }
  button { cursor:pointer; border:0; border-radius:8px; padding:9px 16px; font:inherit;
           background:var(--brand); color:#fff; font-weight:600; }
  button:hover { background:var(--brand-d); }
  button:disabled { background:#9ca3af; cursor:not-allowed; }
  button.ghost { background:#eef2fb; color:var(--brand); padding:6px 12px; font-size:13px; }
  button.danger { background:#b91c1c; }
  .muted { color:var(--muted); font-size:13px; }
  .error { color:var(--bad); font-size:13px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .verdict { border-radius:10px; padding:14px 18px; font-weight:700; font-size:16px; margin:6px 0 12px; }
  .verdict.discriminable { background:var(--ok-bg); color:var(--ok); }
  .verdict.insufficient { background:var(--warn-bg); color:var(--warn); }
  .verdict.not_significant { background:var(--bad-bg); color:var(--bad); }
  .warnbox { background:var(--warn-bg); color:var(--warn); border:1px solid #fcd34d;
             border-radius:8px; padding:10px 14px; font-size:13px; margin:10px 0; }
  .hidden { display:none; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .yes { color:var(--ok); font-weight:700; }
  .no { color:var(--bad); font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>实验管理台</h1>
  <p>三角嗅辨盲评 · 负责人视图</p>
</header>
<main>
  <p class="error" id="fatal"></p>

  <section class="card" id="overview-card" style="display:none">
    <h2>实验概况 <span id="status-badge" class="badge"></span></h2>
    <div class="grid">
      <div class="stat"><div class="k">样本 A</div><div class="v mono" id="sample-a"></div></div>
      <div class="stat"><div class="k">样本 B</div><div class="v mono" id="sample-b"></div></div>
      <div class="stat"><div class="k">截止时间（本地）</div><div class="v" id="deadline"></div></div>
      <div class="stat"><div class="k">最少有效答卷</div><div class="v" id="min-valid"></div></div>
      <div class="stat"><div class="k">已提交 / 总人数</div><div class="v" id="progress"></div></div>
      <div class="stat"><div class="k">服务器时间</div><div class="v mono" id="server-time" style="font-size:14px"></div></div>
    </div>
    <div class="toolbar">
      <button class="ghost" id="refresh-btn">刷新</button>
      <button class="ghost" id="prep-btn">查看倒样制备单（保密）</button>
      <button id="settle-btn" class="danger">截止结算</button>
      <span class="muted" id="settle-hint"></span>
    </div>
    <p class="error" id="action-error"></p>
  </section>

  <section class="card hidden" id="prep-card">
    <h2>🔒 倒样制备单（保密）</h2>
    <div class="warnbox">
      本表包含样本与杯位对应关系，<b>仅供倒样人员使用</b>。请勿向评员泄露，请勿在评员在场时展示。
    </div>
    <table>
      <thead><tr><th>评员</th><th>盲评码</th><th>杯 1</th><th>杯 2</th><th>杯 3</th></tr></thead>
      <tbody id="prep-body"></tbody>
    </table>
  </section>

  <section class="card" id="panelists-card" style="display:none">
    <h2>评员与提交状态</h2>
    <p class="muted">结算前不显示任何答卷内容与杯位分配。</p>
    <table>
      <thead><tr><th>评员</th><th>盲评码</th><th>评员入口</th><th>状态</th></tr></thead>
      <tbody id="panelists-body"></tbody>
    </table>
  </section>

  <section class="card hidden" id="result-card">
    <h2>📊 结算结果（已冻结）</h2>
    <div class="verdict" id="verdict"></div>
    <div class="grid">
      <div class="stat"><div class="k">有效答卷数 n</div><div class="v" id="r-valid"></div></div>
      <div class="stat"><div class="k">答对数 k</div><div class="v" id="r-correct"></div></div>
      <div class="stat"><div class="k">弃权数</div><div class="v" id="r-abstain"></div></div>
      <div class="stat"><div class="k">尾概率 P(X≥k), p₀=1/3</div><div class="v" id="r-p"></div></div>
      <div class="stat"><div class="k">判定阈值</div><div class="v">≤ 0.05</div></div>
      <div class="stat"><div class="k">结算时间</div><div class="v" id="r-settled" style="font-size:14px"></div></div>
    </div>
    <h2 style="margin-top:18px">分配与答卷明细</h2>
    <table>
      <thead><tr>
        <th>评员</th><th>杯 1</th><th>杯 2</th><th>杯 3</th>
        <th>异样杯</th><th>作答</th><th>对错</th><th>提交时间</th>
      </tr></thead>
      <tbody id="result-body"></tbody>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const EXP = qs.get("exp"), TOKEN = qs.get("token");
let lastData = null;

if (!EXP || !TOKEN) {
  $("fatal").textContent = "缺少 exp 或 token 参数，请使用创建实验时生成的管理链接访问。";
} else {
  load();
  setInterval(load, 15000);           // 自动刷新提交进度
  setInterval(tickClock, 1000);       // 本地秒针
}

async function load() {
  try {
    const r = await fetch(`/api/experiments/${EXP}?token=${encodeURIComponent(TOKEN)}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || `加载失败（HTTP ${r.status}）`);
    lastData = data;
    render(data);
    $("action-error").textContent = "";
  } catch (e) {
    $("action-error").textContent = e.message;
  }
}

function render(d) {
  $("overview-card").style.display = "";
  $("panelists-card").style.display = "";
  $("sample-a").textContent = d.sample_a;
  $("sample-b").textContent = d.sample_b;
  $("deadline").textContent = new Date(d.deadline).toLocaleString();
  $("min-valid").textContent = d.min_valid;
  $("progress").textContent = `${d.counts.submitted} / ${d.counts.total}`;

  const badge = $("status-badge");
  if (d.settled) { badge.className = "badge settled"; badge.textContent = "已结算"; }
  else if (d.is_open) { badge.className = "badge open"; badge.textContent = "进行中"; }
  else { badge.className = "badge closed"; badge.textContent = "已截止 · 待结算"; }

  // 结算按钮：仅截止后且未结算时可用（服务端同样强制校验）
  const btn = $("settle-btn");
  btn.disabled = d.settled || d.is_open;
  $("settle-hint").textContent = d.settled
    ? `已于 ${new Date(d.settled_at).toLocaleString()} 结算`
    : (d.is_open ? "截止时间前不可结算" : "可以结算");

  const body = $("panelists-body");
  body.innerHTML = "";
  for (const p of d.panelists) {
    const tr = document.createElement("tr");
    const url = location.origin + p.test_path;
    tr.innerHTML = `<td></td><td class="mono"></td><td class="mono" style="font-size:12px"></td><td></td>`;
    tr.children[0].textContent = p.name;
    tr.children[1].textContent = p.code;
    tr.children[2].textContent = url;
    tr.children[3].innerHTML = p.submitted ? '<span class="yes">已提交</span>' : '<span class="muted">未提交</span>';
    body.appendChild(tr);
  }

  if (d.settled && d.result) renderResult(d.result);
}

function tickClock() {
  if (lastData) {
    // 以服务器时间为基准估算当前时间
    const base = new Date(lastData.server_time).getTime();
    const loaded = lastData._loadedAt || (lastData._loadedAt = Date.now());
    $("server-time").textContent = new Date(base + (Date.now() - loaded)).toLocaleTimeString();
  }
}

$("refresh-btn").onclick = load;

$("settle-btn").onclick = async () => {
  if (!confirm("结算后结果将冻结，不可再接收答卷。确认结算？")) return;
  try {
    const r = await fetch(`/api/experiments/${EXP}/settle?token=${encodeURIComponent(TOKEN)}`, { method: "POST" });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || `结算失败（HTTP ${r.status}）`);
    await load();
  } catch (e) {
    $("action-error").textContent = e.message;
  }
};

let prepLoaded = false;
$("prep-btn").onclick = async () => {
  const card = $("prep-card");
  if (!card.classList.contains("hidden")) { card.classList.add("hidden"); return; }
  if (!prepLoaded) {
    if (!confirm("制备单包含样本与杯位的对应关系，仅供倒样人员保密使用。确认查看？")) return;
    try {
      const r = await fetch(`/api/experiments/${EXP}/preparation?token=${encodeURIComponent(TOKEN)}`);
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || `获取失败（HTTP ${r.status}）`);
      const body = $("prep-body");
      body.innerHTML = "";
      for (const row of data.sheet) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td></td><td class="mono"></td>
          <td class="mono"></td><td class="mono"></td><td class="mono"></td>`;
        tr.children[0].textContent = row.name;
        tr.children[1].textContent = row.code;
        tr.children[2].textContent = row.cups["1"];
        tr.children[3].textContent = row.cups["2"];
        tr.children[4].textContent = row.cups["3"];
        body.appendChild(tr);
      }
      prepLoaded = true;
    } catch (e) {
      $("action-error").textContent = e.message;
      return;
    }
  }
  card.classList.remove("hidden");
};

function renderResult(res) {
  $("result-card").classList.remove("hidden");
  const v = $("verdict");
  v.className = "verdict " + res.verdict;
  v.textContent = {
    discriminable: "✅ 判定：两种样本可辨",
    insufficient: "⚠️ 判定：样本不足，无法判定",
    not_significant: "❌ 判定：证据未达显著性阈值",
  }[res.verdict] + " — " + res.verdict_text;

  $("r-valid").textContent = `${res.valid_count}（要求 ≥ ${res.min_valid}）`;
  $("r-correct").textContent = res.correct_count;
  $("r-abstain").textContent = res.abstained_count;
  $("r-p").textContent = res.p_value.toPrecision(4);
  $("r-settled").textContent = new Date(res.settled_at).toLocaleString();

  const body = $("result-body");
  body.innerHTML = "";
  for (const p of res.panelists) {
    const tr = document.createElement("tr");
    const choice = p.submitted_at ? (p.abstained ? "弃权" : `杯 ${p.choice}`) : "未提交";
    const correct = p.correct === null || p.correct === undefined
      ? '<span class="muted">—</span>'
      : (p.correct ? '<span class="yes">✔ 正确</span>' : '<span class="no">✘ 错误</span>');
    tr.innerHTML = `<td></td>
      <td class="mono"></td><td class="mono"></td><td class="mono"></td>
      <td>杯 ${p.odd_position}</td><td></td><td>${correct}</td>
      <td class="mono" style="font-size:12px"></td>`;
    tr.children[0].textContent = p.name;
    tr.children[1].textContent = p.cups["1"];
    tr.children[2].textContent = p.cups["2"];
    tr.children[3].textContent = p.cups["3"];
    tr.children[5].textContent = choice;
    tr.children[7].textContent = p.submitted_at ? new Date(p.submitted_at).toLocaleString() : "—";
    body.appendChild(tr);
  }
}
</script>
</body>
</html>
